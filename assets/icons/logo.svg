<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="NeoRespring">
  <title>NeoRespring</title>
  <!-- Geometry matches tools/generate_icons.py so the SVG and the PNG icons are the same mark. -->
  <defs>
    <linearGradient id="nrTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A28E0"/>
